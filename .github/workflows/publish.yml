name: Publish Extension

on:
  workflow_dispatch:
  push:
    branches:
      - publish
      - Publish
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for automatic Git release tagging
      id-token: write # Required for Microsoft Marketplace Trusted Publishing (OIDC)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        continue-on-error: true
        run: npx @vscode/vsce@latest publish --oidc --no-dependencies

      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create Git Release Tag
        continue-on-error: true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
