name: Publish Extension

on:
  workflow_dispatch:
  push:
    branches:
      - publish
      - Publish
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    name: Publish to Marketplaces
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Microsoft Marketplace Trusted Publishing (OIDC)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        continue-on-error: true
        run: npx @vscode/vsce@latest publish --oidc --no-dependencies

      - name: Publish to Open VSX Registry
        continue-on-error: true
        run: npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
